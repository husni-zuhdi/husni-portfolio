<tr id="talk_{{ id }}_target">
    <td colspan="4">
        <form class="admin_panel"
              hx-delete="/admin/talks/{{ id }}/delete"
              hx-target="#talks_target"
              hx-swap="innerHTML">
            <p>Are you sure you want to delete Talk with ID {{ id }}?</p>
            <div class="admin_input flex gap-1">
                <button class="btn_text btn_red admin_icon"
                        type="submit"
                        aria-label="Confirm delete talk"
                        title="Delete talk">{% include "admin/partials/icons/trash-2.html" %}</button>
                <button class="btn_text btn_blue admin_icon"
                        aria-label="Cancel deleting talk"
                        title="Cancel"
                        hx-get="/admin/talks/{{ id }}"
                        hx-target="#talk_{{ id }}_target"
                        hx-swap="outerHTML">{% include "admin/partials/icons/x.html" %}</button>
            </div>
        </form>
    </td>
</tr>
