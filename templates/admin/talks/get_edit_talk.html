<tr id="talk_{{ talk.id }}_target">
    <td colspan="4">
        <form class="admin_panel"
              hx-put="/admin/talks/{{ talk.id }}/edit"
              hx-target="#talk_{{ talk.id }}_target"
              hx-swap="outerHTML">
            <h3>Edit Talk #{{ talk.id }}</h3>
            <div class="admin_input">
                <label for=talk_id>Talk ID :</label>
                <input type="text"
                       id="talk_id"
                       name="talk_id"
                       value="{{ talk.id }}"
                       class="readonly"
                       readonly>
            </div>
            <div class="admin_input">
                <label for=talk_name>Name :</label>
                <input type="text" id="talk_name" name="talk_name" value="{{ talk.name }}">
                <br>
            </div>
            <div class="admin_input">
                <label for=talk_date>Date :</label>
                <input type="date" id="talk_date" name="talk_date" value="{{ talk.date }}">
                <br>
            </div>
            <div class="admin_input">
                <label for=talk_media_link>Media Link :</label>
                <input type="url"
                       id="talk_media_link"
                       name="talk_media_link"
                       value="{{ talk.media_link }}">
                <br>
            </div>
            <div class="admin_input">
                <label for=talk_org_name>Organization Name :</label>
                <input type="text"
                       id="talk_org_name"
                       name="talk_org_name"
                       value="{{ talk.org_name }}">
                <br>
            </div>
            <div class="admin_input">
                <label for=talk_org_link>Organization Link :</label>
                <input type="url"
                       id="talk_org_link"
                       name="talk_org_link"
                       value="{{ talk.org_link }}">
                <br>
            </div>
            <div class="admin_input flex gap-1">
                <button class="btn_text btn_green admin_icon"
                        type="submit"
                        aria-label="Save talk"
                        title="Save talk">{% include "admin/partials/icons/check.html" %}</button>
                <button class="btn_text btn_red admin_icon"
                        aria-label="Cancel editing talk"
                        title="Cancel"
                        hx-get="/admin/talks/{{ talk.id }}"
                        hx-target="#talk_{{ talk.id }}_target"
                        hx-swap="outerHTML">{% include "admin/partials/icons/x.html" %}</button>
            </div>
        </form>
    </td>
</tr>
