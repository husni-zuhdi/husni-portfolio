<form class="admin_panel blog-editor-form"
      hx-put="/admin/blogs/{{ id }}/edit"
      hx-target="#blogs_target"
      hx-swap="innerHTML">
    <h3>Edit Blog #{{ id }}</h3>
    <div class="admin_input">
        <label for="blog_id">Blog ID :</label>
        <input type="text"
               id="blog_id"
               name="blog_id"
               value="{{ id }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for="blog_name">Name :</label>
        <input type="text" id="blog_name" name="blog_name" value="{{ name }}">
    </div>
    <div class="admin_input">
        <label>Tags :</label>
        <div class="tag-widget"
             data-available-tags="{{ avail_tags|join(",") }}"
             data-selected-tags="{{ blog_tags|join(",") }}">
            <div class="tag-search-row">
                <input type="text"
                       class="tag-search-input"
                       placeholder="Search or create a tag..."
                       autocomplete="off">
                <div class="tag-dropdown hidden"></div>
            </div>
            <div class="tag-selected-list"></div>
            <noscript>
                <select id="blog_tag" name="blog_tag" multiple>
                    {% for tag in blog_tags %}
                        <option value="{{ tag }}" selected>{{ tag }}</option>
                    {% endfor %}
                    {% for tag in avail_tags %}
                        <option value="{{ tag }}">{{ tag }}</option>
                    {% endfor %}
                </select>
            </noscript>
        </div>
    </div>
    <div class="admin_input body-editor">
        <label>Body (Markdown) :</label>
        <div class="body-editor-tabs md:hidden">
            <button type="button" class="tab-btn active" data-tab="editor">Editor</button>
            <button type="button" class="tab-btn" data-tab="preview">Preview</button>
        </div>
        <div class="body-editor-panes">
            <div class="body-editor-pane active" data-pane="editor">
                <textarea id="blog_body" name="blog_body" rows="20">{{ body }}</textarea>
            </div>
            <div class="body-editor-pane" data-pane="preview">
                <div id="blog_preview" class="blog-preview"></div>
            </div>
        </div>
    </div>
    <div class="admin_input flex gap-1 flex-wrap">
        <button class="btn_text btn_green admin_icon"
                type="submit"
                aria-label="Save blog"
                title="Save blog">{% include "admin/partials/icons/check.html" %}</button>
        <button class="btn_text btn_blue admin_icon"
                type="button"
                aria-label="Preview blog"
                title="Preview"
                hx-post="/admin/blogs/preview"
                hx-include="#blog_body"
                hx-target="#blog_preview"
                hx-swap="innerHTML">{% include "admin/partials/icons/eye.html" %}</button>
        <button class="btn_text btn_red admin_icon"
                aria-label="Cancel editing blog"
                title="Cancel"
                hx-get="/admin/blogs/list"
                hx-target="#blogs_target"
                hx-swap="innerHTML">{% include "admin/partials/icons/x.html" %}</button>
    </div>
</form>
<script src="/statics/admin-blog-editor.js"></script>
