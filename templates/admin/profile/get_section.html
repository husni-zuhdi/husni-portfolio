<div>
    <div>
        <label for=section_id>Section ID :</label>
        <input type="text"
               id="section_id"
               name="section_id"
               value="{{ section.id }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for=section_title>Title :</label>
        <input type="text"
               id="section_title"
               name="section_title"
               value="{{ section.title }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for=section_layout>Layout :</label>
        <input type="text"
               id="section_layout"
               name="section_layout"
               value="{{ section.layout }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for=section_body>Body (Markdown) :</label>
        <textarea id="section_body" name="section_body" rows="10" cols="80" readonly>{{ section.body }}</textarea>
    </div>
    <div id="profile_preview_target"></div>
    <div>
        <button class="btn_text btn_green"
                type="button"
                hx-post="/admin/profile/preview"
                hx-include="#section_body, #section_layout"
                hx-target="#profile_preview_target"
                hx-swap="innerHTML">Preview</button>
        <button class="btn_text btn_blue"
                hx-get="/admin/profile/{{ section.id }}/edit"
                hx-target="#profile_section_{{ section.id }}_target"
                hx-swap="innerHTML">Edit</button>
    </div>
</div>
