{% extends "admin/admin_base.html" %}
{% block title %}Admin Profile{% endblock %}
{% block description %}"Husni Naufal Zuhdi Admin Profile"{% endblock %}
{% block content %}
    <div id="profile_top_section_target" class="top_section">
        <h1 class="mb-4 font-semibold uppercase md:justify-start">Admin Profile</h1>
        <p>Manage your Profile page sections.</p>
        <div class="flex flex-col justify-between lg:flex-row">
            <div class="top_section">
                <button class="btn_text btn_green admin_icon"
                        aria-label="Add profile section"
                        title="Add section"
                        hx-get="/admin/profile/add"
                        hx-target="#profile_target"
                        hx-swap="innerHTML">{% include "admin/partials/icons/plus.html" %}</button>
                <button class="btn_text btn_blue"
                        hx-get="/admin/profile/meta/edit"
                        hx-target="#profile_target"
                        hx-swap="innerHTML">Edit Meta</button>
            </div>
        </div>
    </div>
    <hr>
    <div id="profile_target" hx-get="/admin/profile/list" hx-trigger="load"></div>
{% endblock content %}
