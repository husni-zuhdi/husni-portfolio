<form hx-put="/admin/profile/{{ section.id }}/edit"
      hx-target="#profile_section_{{ section.id }}_target"
      hx-swap="innerHTML">
    <div>
        <label for=section_id>Section ID :</label>
        <input type="text"
               id="section_id"
               name="section_id"
               value="{{ section.id }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for=section_title>Title (leave empty for the page title section) :</label>
        <input type="text"
               id="section_title"
               name="section_title"
               value="{{ section.title }}">
        <br>
    </div>
    <div class="admin_input">
        <label for=section_layout>Layout :</label>
        <select id="section_layout" name="section_layout">
            {% if section.layout == "cards" %}
                <option value="stacked">Stacked</option>
                <option value="cards" selected>Cards</option>
            {% else %}
                <option value="stacked" selected>Stacked</option>
                <option value="cards">Cards</option>
            {% endif %}
        </select>
        <br>
    </div>
    <div class="admin_input">
        <label for=section_body>Body (Markdown) :</label>
        <br>
        <textarea id="section_body" name="section_body" rows="10" cols="80">{{ section.body }}</textarea>
    </div>
    <div id="profile_preview_target"></div>
    <div>
        <button class="btn_text btn_green" type="submit">o</button>
        <button class="btn_text btn_blue"
                type="button"
                hx-post="/admin/profile/preview"
                hx-include="closest form"
                hx-target="#profile_preview_target"
                hx-swap="innerHTML">Preview</button>
        <button class="btn_text btn_red"
                hx-get="/admin/profile/{{ section.id }}"
                hx-target="#profile_section_{{ section.id }}_target"
                hx-swap="innerHTML">x</button>
    </div>
</form>
