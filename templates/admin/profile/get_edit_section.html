<tr id="profile_section_{{ section.id }}_target">
    <td colspan="4">
        <form class="admin_panel section-editor-form"
              hx-put="/admin/profile/{{ section.id }}/edit"
              hx-target="#profile_section_{{ section.id }}_target"
              hx-swap="outerHTML">
            <h3>Edit Section #{{ section.id }}</h3>
            <div>
                <label for=section_id>Section ID :</label>
                <input type="text"
                       id="section_id"
                       name="section_id"
                       value="{{ section.id }}"
                       class="readonly"
                       readonly>
            </div>
            <div class="admin_input">
                <label for=section_title>Title (leave empty for the page title section) :</label>
                <input type="text"
                       id="section_title"
                       name="section_title"
                       value="{{ section.title }}">
                <br>
            </div>
            <div class="admin_input">
                <label for=section_layout>Layout :</label>
                <select id="section_layout" name="section_layout">
                    {% if section.layout == "cards" %}
                        <option value="stacked">Stacked</option>
                        <option value="cards" selected>Cards</option>
                    {% else %}
                        <option value="stacked" selected>Stacked</option>
                        <option value="cards">Cards</option>
                    {% endif %}
                </select>
                <br>
            </div>
            <div class="admin_input body-editor">
                <label for=section_body>Body (Markdown) :</label>
                <div class="body-editor-tabs md:hidden">
                    <button type="button" class="tab-btn active" data-tab="editor">Editor</button>
                    <button type="button" class="tab-btn" data-tab="preview">Preview</button>
                </div>
                <div class="body-editor-panes">
                    <div class="body-editor-pane active" data-pane="editor">
                        <textarea id="section_body" name="section_body" rows="20">{{ section.body }}</textarea>
                    </div>
                    <div class="body-editor-pane" data-pane="preview">
                        <div id="section_preview" class="blog-preview"></div>
                    </div>
                </div>
            </div>
            <div class="admin_input flex gap-1">
                <button class="btn_text btn_green admin_icon"
                        type="submit"
                        aria-label="Save section"
                        title="Save section">{% include "admin/partials/icons/check.html" %}</button>
                <button class="btn_text btn_blue admin_icon"
                        type="button"
                        aria-label="Preview section"
                        title="Preview"
                        hx-post="/admin/profile/preview"
                        hx-include="closest form"
                        hx-target="#section_preview"
                        hx-swap="innerHTML">{% include "admin/partials/icons/eye.html" %}</button>
                <button class="btn_text btn_red admin_icon"
                        aria-label="Cancel editing section"
                        title="Cancel"
                        hx-get="/admin/profile/{{ section.id }}"
                        hx-target="#profile_section_{{ section.id }}_target"
                        hx-swap="outerHTML">{% include "admin/partials/icons/x.html" %}</button>
            </div>
        </form>
    </td>
</tr>
