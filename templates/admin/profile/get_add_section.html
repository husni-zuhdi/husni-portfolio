<form class="admin_panel"
      hx-post="/admin/profile/add"
      hx-target="#profile_target"
      hx-swap="innerHTML">
    <h3>Add Section #{{ id }}</h3>
    <div>
        <label for=section_id>Section ID :</label>
        <input type="text"
               id="section_id"
               name="section_id"
               value="{{ id }}"
               class="readonly"
               readonly>
    </div>
    <div class="admin_input">
        <label for=section_title>Title (leave empty for the page title section) :</label>
        <input type="text" id="section_title" name="section_title" value="">
        <br>
    </div>
    <div class="admin_input">
        <label for=section_layout>Layout :</label>
        <select id="section_layout" name="section_layout">
            <option value="stacked" selected>Stacked</option>
            <option value="cards">Cards</option>
        </select>
        <br>
    </div>
    <div class="admin_input">
        <label for=section_body>Body (Markdown) :</label>
        <br>
        <textarea id="section_body" name="section_body" rows="10" cols="80"></textarea>
    </div>
    <div id="profile_preview_target"></div>
    <div class="admin_input flex gap-1">
        <button class="btn_text btn_green admin_icon"
                type="submit"
                aria-label="Save new section"
                title="Save section">{% include "admin/partials/icons/check.html" %}</button>
        <button class="btn_text btn_blue admin_icon"
                type="button"
                aria-label="Preview section"
                title="Preview"
                hx-post="/admin/profile/preview"
                hx-include="closest form"
                hx-target="#profile_preview_target"
                hx-swap="innerHTML">{% include "admin/partials/icons/eye.html" %}</button>
        <button class="btn_text btn_red admin_icon"
                aria-label="Cancel adding section"
                title="Cancel"
                hx-get="/admin/profile/list"
                hx-target="#profile_target"
                hx-swap="innerHTML">{% include "admin/partials/icons/x.html" %}</button>
    </div>
</form>
