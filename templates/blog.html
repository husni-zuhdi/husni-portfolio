{% extends "base.html" %}
{% block title %}{{ id }} - {{ name }}{% endblock %}
{% block description %}"Blog {{ id }} - {{ name }}"{% endblock %}
{% block content %}
    <!-- Syntax Highlighting -->
    <link href="https://unpkg.com/nord-highlightjs@0.1.0/dist/nord.css"
          rel="stylesheet"
          type="text/css" />
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <!-- Temml -->
    <link rel="stylesheet" href="/statics/temml/Temml-Local.css" />
    <script src="/statics/temml/temml.min.js"></script>
    <!-- Pele -->
    <script src="/statics/pele/pele.global.js"></script>
    <script>
        function renderBlogMathAndDiagrams(root) {
            root = root || document.body;
            temml.renderMathInElement(root, { fences: "$+" });
            root.querySelectorAll('pre.mermaid').forEach(function(el) {
                try {
                    pele.mount(el, el.textContent, { zoom: false });
                } catch (err) {
                    console.error('Pele render failed:', err);
                }
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            renderBlogMathAndDiagrams(document.body);
        });
    </script>
    <div>{{ body|safe }}</div>
    <div>
        <p>
            Tags:
            {% for tag in tags %}
                {% if tag == "" %}
                    <!-- No tag to render  -->
                    <!-- Skip this tag -->
                {% else %}
                    <button hx-get="/blogs?tags={{ tag }}"
                            hx-target="#body_target"
                            hx-swap="innerHTML"
                            hx-replace-url="true"
                            class="inactive_tag"><span aria-hidden="true">{% include "admin/partials/icons/tag.html" %}</span>{{ tag }}</button>
                {% endif %}
            {% endfor %}
        </p>
    </div>
{% endblock content %}
