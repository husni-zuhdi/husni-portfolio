name: Rust Security Audit
on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches-ignore:
      - 'main'
    paths: 
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/rust-audit.yml'

jobs:
  rust_security_audit:
    name: Rust Security Audit
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        rust-version: "1.91.0"
        log-level: warn
        command: check all
        arguments: "--all-features --locked"
