name: Rust Continuous Integration

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '**/*.rs'
      - 'build.rs'
      - 'templates/**'
      - 'Taskfile.yml'
      - 'prek.toml'
      - 'env.example'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '**/*.rs'
      - 'build.rs'
      - 'templates/**'
      - 'Taskfile.yml'
      - 'prek.toml'
      - 'env.example'
      - '.github/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_STRIP: "debuginfo"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: "rustfmt, clippy"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.12.0"
      - run: cargo test --all-features --locked -- --test-threads=1

  nextest_unit_test:
    name: Nextest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: "rustfmt, clippy"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.114
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.12.0"
      - run: cargo nextest run --locked

  format:
    name: Formatting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: "rustfmt, clippy"
      - run: cargo fmt --check

  clippy:
    name: Clippy Linting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: "rustfmt, clippy"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.12.0"
      - run: cargo clippy --locked -- -D warnings

  coverage:
    name: Code coverage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: "rustfmt, clippy"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.34.1
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.12.0"
      - run: cargo tarpaulin --ignore-tests --follow-exec --locked --coveralls ${{ secrets.COVERALLS_REPO_TOKEN }}
