[package]
name = "husni-portfolio"
version = "0.3.5"
edition = "2021"
build = "build.rs"
license =  "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.54", features = ["full"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower_governor = { version = "0.8", features = ["axum"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
askama = { version = "0.16"}
serde = { version="1.0", features = ["derive"]}
serde_json = "1.0"
markdown = "1.0"
test-log = "0.2"
http-body-util = "0.1"
regex = "1.13"
async-trait = "0.1"
dyn-clone = "1.0"
libsql = "0.10"
urlencoding = "2.1"
chrono = "0.4"
password-hash = {version = "0.6", features = ["phc"]}
argon2 = "=0.6"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
google-cloud-storage = "1.21"
bytes = "1.12"
moka = { version = "0.12", features = ["future"] }
ammonia = "4.2"
ring = "0.17"
dotenvy = "0.15"

[build-dependencies]
anyhow = "1.0"
vergen-gitcl = { version = "10.0", features = ["build"] }
